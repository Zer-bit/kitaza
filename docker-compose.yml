name: kitaza

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitaza
      POSTGRES_PASSWORD: kitaza
      POSTGRES_DB: kitaza
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitaza -d kitaza"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Cached dashboards and rate-limit counters are both disposable, so no
    # persistence is configured; a restart simply warms up again.
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://kitaza:kitaza@postgres:5432/kitaza
      REDIS_URL: redis://redis:6379
      KITAZA_JWT_SECRET: ${KITAZA_JWT_SECRET:-local-development-secret-change-me-32}
      KITAZA_ALLOWED_ORIGINS: ${KITAZA_ALLOWED_ORIGINS:-*}
      KITAZA_LOG: info,kitaza_server=debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # A dump every day, two weeks kept, in ./backups on the host. Uses the same
  # Postgres major version as the database so pg_dump can always read it.
  # Point DATABASE_URL at Supabase instead to back up a hosted database.
  backup:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: ${BACKUP_DATABASE_URL:-postgres://kitaza:kitaza@postgres:5432/kitaza}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./infra/backup:/scripts:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /scripts/backup.sh || echo "backup failed; will retry next interval"
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
