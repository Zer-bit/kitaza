[package]
name = "kitaza-server"
version = "0.1.0"
edition = "2024"

[features]
# Enables the tests in `tests/`, which need a Postgres they can create
# databases in: `DATABASE_URL=... cargo test --features integration`.
integration = []

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rand = "0.10.3"
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager", "json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rust_decimal = { version = "1.43.0", features = ["serde-float", "db-postgres"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "macros", "migrate", "rust_decimal"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-br", "compression-gzip", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
